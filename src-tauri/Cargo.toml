[package]
name = "local-postman"
version = "0.2.0"
edition = "2021"
[lib]
name = "local_postman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "gzip", "brotli", "deflate", "cookies", "rustls-tls", "system-proxy"], default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
url = "2"
reqwest_cookie_store = "0.9"
[dev-dependencies]
flate2 = "1"
tokio-rustls = {version="0.26",default-features=false,features= ["ring", "tls12"] }
tempfile = "3"
